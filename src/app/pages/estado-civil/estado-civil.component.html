<div class="container mt-4">
  <h2>Gestión de Estados Civiles</h2>

  <!-- Formulario -->
  <div class="card my-3 p-3">
    <h4>{{ modoEdicion ? 'Editar' : 'Nuevo' }} Estado Civil</h4>
    <form (ngSubmit)="guardar()">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="estadoActual.nombre" name="nombre" required />
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="estadoCheck" [(ngModel)]="estadoActual.estado" name="estado" />
        <label class="form-check-label" for="estadoCheck">Activo</label>
      </div>
      <button type="submit" class="btn btn-primary me-2">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="limpiarFormulario()" *ngIf="modoEdicion">
        Cancelar
      </button>
    </form>
  </div>

  <!-- Tabla -->
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of listaEstados">
        <td>{{ item.idEstadoCivil }}</td>
        <td>{{ item.nombre }}</td>
        <td>
          <span class="badge" [ngClass]="item.estado ? 'bg-success' : 'bg-danger'">
            {{ item.estado ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="editar(item)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="eliminar(item.idEstadoCivil)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="listaEstados.length === 0">
        <td colspan="4" class="text-center">No hay registros disponibles.</td>
      </tr>
    </tbody>
  </table>
</div>
