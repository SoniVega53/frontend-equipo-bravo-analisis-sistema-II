<div
  [style.cursor]="eActiveAction ? 'pointer' : 'default'"
  [style.width]="width"
  [style.height]="height"
  class="avatar-wrapper me-4 position-relative"
  (click)="abrirSelectorImagen()"
>
  @if (fotografia && fotografia.length > 0) {
    <img [src]="fotografia" alt="Avatar" class="avatar-img shadow-sm"/>
  } @else {
    <div
      class="avatar-placeholder shadow-sm d-flex justify-content-center align-items-center"
    >
      <span class="w-bold text-white" [style.font-size]="fontSize">
        {{ printName()?.charAt(0) || "U" }}
      </span>
    </div>
  }

  @if (eActiveAction) {
    <div
      class="avatar-edit-overlay d-flex justify-content-center align-items-center shadow-sm"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="28"
        height="28"
        fill="currentColor"
        class="bi bi-camera-fill text-white"
        viewBox="0 0 16 16"
      >
        <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z" />
        <path
          d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1zm9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z"
        />
      </svg>
    </div>

    <input
      type="file"
      #fileInput
      class="d-none"
      accept="image/*"
      (change)="onFileSelected($event)"
    />
  }
</div>
