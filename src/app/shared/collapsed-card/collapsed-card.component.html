<div class="form-card" [hidden]="hidden">
  <div
    class="form-card-header d-flex justify-content-between align-items-center mb-3"
  >
    <h5 class="m-0 fw-bold">Formulario</h5>
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary toggle-btn"
      (click)="toggleForm()"
    >
      @if (isFormCollapsed) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-chevron-down"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"
          />
        </svg>
        <span class="ms-1">Mostrar</span>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-chevron-up"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708l6-6z"
          />
        </svg>
        <span class="ms-1">Ocultar</span>
      }
    </button>
  </div>

  <div class="form-card-body" [class.collapsed]="isFormCollapsed">
    <ng-content></ng-content>
  </div>
</div>
