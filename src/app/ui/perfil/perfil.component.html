<div class="perfil-container container-fluid py-4">

  <div class="row mb-4">
    <div class="col-12">
      <div class="perfil-header-card d-flex align-items-center">
        
        <avatar-icono 
          [idUsuario]="usuarioModel.idUsuario" 
          [nombre]="usuarioModel.nombre" 
          [fotografia]="usuarioModel.fotografia" 
          (updateFoto)="updateFoto($event)"
          >
        </avatar-icono>        

        <div class="user-info">
          <h2 class="fw-bold mb-1">{{ usuarioModel?.nombre }} {{ usuarioModel?.apellido }}</h2>
          <p class="text-muted mb-2 fs-5">{{ usuarioModel?.rol }} | {{ usuarioModel?.empresa }}</p>
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill">
            Sucursal: {{ usuarioModel?.sucursal }}
          </span>
        </div>
      </div>
    </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="perfil-body-card edit-card h-100">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
          <div class="d-flex align-items-center">
            <div class="icon-circle bg-primary-subtle text-primary me-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-person-lines-fill" viewBox="0 0 16 16">
                <path d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zM11 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5zm.5 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1h-4zm2 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zm0 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2z"/>
              </svg>
            </div>
            <h4 class="fw-bold m-0">Información Personal</h4>
          </div>
          @if (hasChanges) {
            <span class="badge bg-warning text-dark px-3 py-2 rounded-pill shadow-sm">
              Cambios sin guardar
            </span>
          }
        </div>

        <app-dynamic-form
          [fields]="camposEditables"
          [model]="usuarioModel"
          [isLoading]="isLoading"
          [showSave]="hasChanges"
          [showCancel]="hasChanges"
          [showDelete]="false"
          saveText="Actualizar Perfil"
          cancelText="Descartar Cambios"
          (save)="guardarPerfil($event)"
          (cancel)="descartarCambios()"
        >
        </app-dynamic-form>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="perfil-body-card info-card h-100">
        <div class="d-flex align-items-center mb-4 border-bottom pb-3">
          <div class="icon-circle bg-secondary-subtle text-secondary me-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 62.467 62.467 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5z"/>
            </svg>
          </div>
          <h4 class="fw-bold m-0">Datos del Sistema</h4>
        </div>

        <app-dynamic-form
          [fields]="camposInformativos"
          [model]="usuarioModel"
          [isLoading]="isLoading"
          [showSave]="false"
          [showCancel]="false"
          [showDelete]="false"
        >
        </app-dynamic-form>
      </div>
    </div>
  </div>
</div>
