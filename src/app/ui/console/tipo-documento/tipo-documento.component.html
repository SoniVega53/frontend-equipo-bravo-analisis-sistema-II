<div class="center-page">
  <div class="page-container position-relative">
    <app-loader [isLoading]="isLoadingPage"></app-loader>

    <h2 class="page-title">Tipos de Documento</h2>

    <collapsed-card [hidden]="hiddenFormulary()">
      <app-dynamic-form
        [fields]="configuracionCampos"
        [model]="tipoDocumentoActual"
        [isLoading]="isLoading"
        [showDelete]="showDeleteButton(tipoDocumentoActual.idTipoDocumento)"
        [showSave]="showSaveButton(tipoDocumentoActual.idTipoDocumento)"
        [showCancel]="true"
        (save)="guardar($event)"
        (delete)="eliminar(tipoDocumentoActual.idTipoDocumento)"
        (cancel)="limpiarFormulario()"
      >
      </app-dynamic-form>
    </collapsed-card>

    @if (roleSecurity?.consultar) {
      <hr class="divider" />

      <app-dynamic-table
        [columns]="columnasTiposDocumento"
        [data]="tiposDocumento"
        [isLoading]="isLoading"
        [showExport]="roleSecurity?.exportar || false"
        [showPrint]="roleSecurity?.imprimir || false"
        [reportName]="'Reporte_Tipos_Documento_Sistema'"
        [hiddenAccion]="hiddenAction()"
        (actionSelect)="seleccionarParaEditar($event)"
      >
      </app-dynamic-table>
    }
  </div>
</div>
