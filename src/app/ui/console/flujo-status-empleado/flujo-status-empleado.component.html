<div class="center-page">
  <div class="page-container position-relative">
    <app-loader [isLoading]="isLoadingPage"></app-loader>

    <h2 class="page-title">Flujo de Estatus de Empleado</h2>

    <collapsed-card [hidden]="hiddenFormulary()">
      <app-dynamic-form
        [saveText]="isUpdate ? 'Actualizar' : 'Crear Nuevo'"
        [fields]="configuracionCampos"
        [model]="flujoActual"
        [isLoading]="isLoading"
        [showDelete]="showDeleteButton(isUpdate ? 1 : undefined) && isUpdate"
        [showSave]="showSaveButton(isUpdate ? 1 : undefined)"
        [showCancel]="true"
        (save)="guardar()"
        (delete)="eliminar()"
        (cancel)="limpiarFormulario()"
      >
      </app-dynamic-form>
    </collapsed-card>

    @if (roleSecurity.consultar) {
      <hr class="divider" />

      <app-dynamic-table
        [columns]="columnasFlujo"
        [data]="flujos"
        [isLoading]="isLoading"
        [showSearch]="true"
        [showExport]="roleSecurity.exportar || false"
        [showPrint]="roleSecurity.imprimir || false"
        [reportName]="'Reporte_Flujo_Status_Empleado'"
        [hiddenAccion]="hiddenAction()"
        (actionSelect)="seleccionarParaEditar($event)"
      >
      </app-dynamic-table>
    }
  </div>
</div>
