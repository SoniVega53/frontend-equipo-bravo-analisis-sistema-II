<div class="center-page">
      <div class="page-container position-relative">
        <h2 class="page-title">Liquidaciones</h2>
        <hr class="divider" />
        
        <ul class="nav nav-tabs mb-4">
          <li class="nav-item">
            <a class="nav-link" [class.active]="activeTab === 'procesar'" (click)="activeTab = 'procesar'" style="cursor: pointer;">
              Procesar Liquidación
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" [class.active]="activeTab === 'historial'" (click)="activeTab = 'historial'" style="cursor: pointer;">
              Historial General
            </a>
          </li>
        </ul>

        <div class="tab-content">
          <app-liquidacion-procesar *ngIf="activeTab === 'procesar'"></app-liquidacion-procesar>
          <app-liquidacion-historial *ngIf="activeTab === 'historial'"></app-liquidacion-historial>
        </div>
      </div>
    </div>
