
<div class="center-page">
  <div class="page-container position-relative">
    <app-loader [isLoading]="isLoadingPage"></app-loader>

    <h2 class="page-title">Estatus de Empleado</h2>

    <collapsed-card [hidden]="hiddenFormulary()">
      <app-dynamic-form
        [fields]="configuracionCampos"
        [model]="statusEmpleadoActual"
        [isLoading]="isLoading"
        [showDelete]="showDeleteButton(statusEmpleadoActual.idStatusEmpleado)"
        [showSave]="showSaveButton(statusEmpleadoActual.idStatusEmpleado)"
        [showCancel]="true"
        (save)="guardar($event)"
        (delete)="eliminar(statusEmpleadoActual.idStatusEmpleado)"
        (cancel)="limpiarFormulario()"
      >
      </app-dynamic-form>
    </collapsed-card>

    @if (roleSecurity?.consultar) {
      <hr class="divider" />

      <app-dynamic-table
        [columns]="columnasStatusEmpleado"
        [data]="statusEmpleados"
        [isLoading]="isLoading"
        [showExport]="roleSecurity?.exportar || false"
        [showPrint]="roleSecurity?.imprimir || false"
        [reportName]="'Reporte_Estatus_Empleado'"
        [hiddenAccion]="hiddenAction()"
        (actionSelect)="seleccionarParaEditar($event)"
      >
      </app-dynamic-table>
    }
  </div>
</div>
