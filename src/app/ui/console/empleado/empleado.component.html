<div class="center-page">
  <div class="page-container position-relative">
    <app-loader [isLoading]="isLoadingPage"></app-loader>

    <h2 class="page-title">Empleados</h2>

    <collapsed-card [hidden]="hiddenFormulary()">
      <app-dynamic-form
        [saveText]="isUpdate ? 'Actualizar' : 'Crear Nuevo'"
        [fields]="configuracionCampos"
        [model]="empleadoActual"
        [isLoading]="isLoading"
        [showDelete]="showDeleteButton(empleadoActual?.idEmpleado) && isUpdate"
        [showSave]="showSaveButton(empleadoActual?.idEmpleado)"
        [showCancel]="true"
        (save)="guardar()"
        (delete)="eliminar()"
        (cancel)="limpiarFormulario()"
      >
      </app-dynamic-form>
    </collapsed-card>

    @if (roleSecurity?.consultar) {
      <hr class="divider" />

      <app-dynamic-table
        [columns]="columnas"
        [data]="empleados"
        [isLoading]="isLoading"
        [showExport]="roleSecurity?.exportar || false"
        [showPrint]="roleSecurity?.imprimir || false"
        [reportName]="'Reporte_Empleados'"
        [hiddenAccion]="hiddenAction()"
        (actionSelect)="seleccionarParaEditar($event)"
      >
      </app-dynamic-table>
    }
  </div>
</div>
