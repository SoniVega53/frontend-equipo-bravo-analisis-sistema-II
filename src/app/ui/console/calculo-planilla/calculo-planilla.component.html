<div class="center-page">
  <div class="page-container position-relative">
    <h2 class="page-title">Módulo de Planillas</h2>
    <hr class="divider" />

    <ul class="nav nav-tabs nav-fill mb-4" role="tablist">
        <li class="nav-item">
            <a class="nav-link" [class.active]="activeTab === 'procesar'" (click)="activeTab = 'procesar'"
                role="tab" style="cursor: pointer;">
                <i class="bi bi-calculator me-2"></i>Calcular Planilla
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" [class.active]="activeTab === 'periodo'" (click)="activeTab = 'periodo'"
                role="tab" style="cursor: pointer;">
                <i class="bi bi-calendar3 me-2"></i>Gestión de Periodos
            </a>
        </li>
    </ul>

    <div class="tab-content mt-3">
        <!-- Tab Procesar -->
        <div class="tab-pane fade" [class.show]="activeTab === 'procesar'" [class.active]="activeTab === 'procesar'">
            <app-calculo-planilla-procesar *ngIf="activeTab === 'procesar'"></app-calculo-planilla-procesar>
        </div>

        <!-- Tab Periodos -->
        <div class="tab-pane fade" [class.show]="activeTab === 'periodo'" [class.active]="activeTab === 'periodo'">
            <app-calculo-planilla-periodo *ngIf="activeTab === 'periodo'"></app-calculo-planilla-periodo>
        </div>
    </div>

  </div>
</div>
