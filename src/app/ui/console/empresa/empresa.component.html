<div class="p-4" style="max-width: 800px; margin: auto">
  <div class="row gap-4">
    <div class="col-12 col-md-5">
      <app-dropdown-select
        label="Sucursal"
        placeholder="Elija una sucursal..."
        iconLeft="bi-building"
        [options]="sucursales"
        [(ngModel)]="sucursalSeleccionada"
      >
      </app-dropdown-select>

      <div class="mt-3 p-3 bg-light border rounded">
        <strong>Modelo actual (Dropdown):</strong>
        <pre class="mb-0 mt-2">{{ sucursalSeleccionada | json }}</pre>
      </div>
    </div>

    <div class="col-12 col-md-5">
      <app-multi-combo-box
        label="Roles Asignados"
        placeholder="Seleccione uno o más roles..."
        iconLeft="bi-person-badge"
        [options]="roles"
        [(ngModel)]="rolesSeleccionados"
      >
      </app-multi-combo-box>

      <div class="mt-3 p-3 bg-light border rounded">
        <strong>Modelo actual (Multi Combo Box):</strong>
        <pre class="mb-0 mt-2">{{ rolesSeleccionados | json }}</pre>
      </div>
    </div>
  </div>
</div>
