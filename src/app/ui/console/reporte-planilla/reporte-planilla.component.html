<div class="center-page">
  <div class="page-container position-relative">
    <app-loader [isLoading]="isLoadingPage"></app-loader>

    <h2 class="page-title">Reporte de Planilla</h2>
    <hr class="divider" />

    <collapsed-card [hidden]="!roleSecurity.consultar">
        <app-dropdown-select
          [id]="fieldDate.name"
          [label]="fieldDate.label"
          [placeholder]="fieldDate.placeholder || 'Seleccione...'"
          [iconLeft]="fieldDate.iconLeft || ''"
          [disabled]="fieldDate.disabled || isLoading"
          [options]="fieldDate.options || []"
          [(ngModel)]="modeloDate"
          [required]="fieldDate.required || false"
          [showSearch]="true"
          (selectionChange)="actionMonthSelected($event)"
          [name]="fieldDate.name">
        </app-dropdown-select>
    </collapsed-card>

    @if (resumenPlanilla) {
      <div class="mt-4 fade-in">
       <div class="d-flex justify-content-end mb-3 gap-2">
             <button *ngIf="roleSecurity.imprimir" class="btn btn-light border" (click)="imprimirPdf()" [disabled]="isLoading">
                <i class="bi bi-printer-fill me-2 text-primary"></i> Imprimir PDF
            </button>
             <button *ngIf="roleSecurity.exportar" class="btn custom-btn-primary" (click)="descargarPdf()" [disabled]="isLoading">
                <i class="bi bi-file-earmark-pdf-fill me-2"></i> Descargar PDF
            </button>
        </div>

        <app-kpi-cards 
            title="Resumen Planilla" 
            [items]="kpisLiquidacion">
        </app-kpi-cards>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 pb-2 border-bottom">
            <div class="d-flex align-items-center gap-2">
                <div class="section-indicator"></div>
                <h5 class="text-dark fw-bold m-0">Desglose por Empleado</h5>
            </div>
            
            <div class="audit-badge d-flex align-items-center gap-2 px-3 py-1-5 rounded-pill bg-light border">
                <i class="bi bi-clock-history text-muted"></i>
                <span class="text-secondary small fw-medium">
                    Procesado: <strong class="text-dark">{{ resumenPlanilla.fechaHoraProcesada | date:'dd/MM/yyyy HH:mm' }}</strong>
                </span>
            </div>
        </div>

        <div class="search-container">
            <input 
            type="text" 
            class="form-control search-input" 
            placeholder="Buscar empleado..." 
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchChange()">
        </div>

        <app-dynamic-table
          [scrollTop]="false"
          [currentPage]="currentPage"
          (currentPageChange)="currentPage = $event"
          [columns]="columnasDetalle"
          [data]="filteredOptions"
          [isLoading]="isLoading"
          [showExport]="false"
          [showPrint]="false"
          [reportName]="'Reporte_Planilla_Detalle'"
          [hiddenAccion]="true"
          [pageSize]="20"
        >
        </app-dynamic-table>
      </div>
    }
  </div>
</div>
