<div class="center-page">
  <div class="page-container">
    <h2 class="page-title">Géneros</h2>

    <div class="form-card">
      <form (ngSubmit)="guardar()" #generoForm="ngForm">
        <div class="row align-items-end g-3">
          <div class="col-8">
            <custom-input
              id="nombre"
              name="nombre"
              label="Nombre"
              placeholder="Ej: Masculino"
              [(ngModel)]="generoActual.nombre"
              [disabled]="isLoading"
              required
            >
            </custom-input>
          </div>
        </div>
        <div class="action-buttons">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!generoForm.valid || isLoading"
          >
            Guardar
          </button>

          <button
            type="button"
            class="btn btn-danger"
            *ngIf="generoActual.idGenero"
            (click)="eliminar(generoActual.idGenero)"
            [disabled]="isLoading"
          >
            Eliminar
          </button>

          <button
            type="button"
            class="btn btn-outline-secondary"
            *ngIf="generoActual.idGenero"
            (click)="limpiarFormulario()"
            [disabled]="isLoading"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>

    <hr class="divider" />

    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Creación</th>
              <th>Modificación</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let g of generos">
              <td>{{ g.idGenero }}</td>
              <td>{{ g.nombre }}</td>
              <td>
                <small class="d-block text-muted">{{
                  g.usuarioCreacion
                }}</small>
                <small class="d-block">{{
                  g.fechaCreacion | date: "short"
                }}</small>
              </td>
              <td>
                <small class="d-block text-muted">{{
                  g.usuarioModificacion || "N/A"
                }}</small>
                <small class="d-block">{{
                  g.fechaModificacion
                    ? (g.fechaModificacion | date: "short")
                    : "-"
                }}</small>
              </td>
              <td class="text-center">
                <button
                  class="btn btn-sm btn-outline-primary"
                  (click)="seleccionarParaEditar(g)"
                  [disabled]="isLoading"
                >
                  Seleccionar
                </button>
              </td>
            </tr>
            <tr *ngIf="generos.length === 0">
              <td colspan="5" class="text-center py-4 text-muted">
                No hay géneros registrados.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
