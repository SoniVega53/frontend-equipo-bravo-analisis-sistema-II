    <h2 class="page-title">Géneros</h2>

    <div class="form-card">
      <app-dynamic-form
        [fields]="configuracionCampos"
        [model]="generoActual"
        [isLoading]="isLoading"
        [showDelete]="generoActual.idGenero ? true : false"
        [showCancel]="true"
        (save)="guardar($event)"
        (delete)="eliminar(generoActual.idGenero)"
        (cancel)="limpiarFormulario()"
      >
      </app-dynamic-form>
